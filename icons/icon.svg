<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#7c5cfc" stroke-width="12" opacity="0.3"/>
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#7c5cfc" stroke-width="8"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="16" fill="#7c5cfc"/>
  <!-- Hour markers -->
  <g stroke="#e8e8f0" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="116" x2="256" y2="146"/>
    <line x1="256" y1="366" x2="256" y2="396"/>
    <line x1="116" y1="256" x2="146" y2="256"/>
    <line x1="366" y1="256" x2="396" y2="256"/>
  </g>
  <!-- Hands -->
  <line x1="256" y1="256" x2="320" y2="196" stroke="#7c5cfc" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="206" y2="316" stroke="#e8a0ff" stroke-width="6" stroke-linecap="round"/>
  <!-- Decorative dots at 45° positions -->
  <circle cx="256" cy="132" r="6" fill="#7c5cfc" opacity="0.6"/>
  <circle cx="256" cy="380" r="6" fill="#7c5cfc" opacity="0.6"/>
  <circle cx="132" cy="256" r="6" fill="#7c5cfc" opacity="0.6"/>
  <circle cx="380" cy="256" r="6" fill="#7c5cfc" opacity="0.6"/>
</svg>
